<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ส่งรูปภาพสนทนาธรรม 4 ฝ่าย</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Sarabun", "Noto Sans Thai", sans-serif; background: #f2f4f7; color: #1a1a1a; font-size: 20px; }
  header { background: #0b5cad; color: #fff; padding: 18px 16px; text-align: center; }
  header h1 { margin: 0; font-size: 26px; }
  header p { margin: 6px 0 0; font-size: 20px; }
  #sum, #name { margin: 14px 16px 4px; padding: 14px; background: #fff; border-radius: 14px; text-align: center; font-size: 22px; font-weight: 700; }
  #name { font-size: 28px; }
  .hint { margin: 10px 16px; text-align: center; font-size: 20px; }
  #list, #slots { padding: 0 16px 32px; display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  #slots { padding-bottom: 12px; }
  .a { display: flex; justify-content: space-between; align-items: center; width: 100%; min-height: 76px; padding: 12px 18px; border: 3px solid #c3c9d2; border-radius: 16px; background: #fff; font: inherit; font-size: 24px; font-weight: 700; text-align: left; color: inherit; cursor: pointer; }
  .a small { font-size: 18px; font-weight: 600; color: #8a5a00; white-space: nowrap; margin-left: 10px; }
  .a.part { border-color: #d9a400; background: #fff7dc; }
  .a.done { border-color: #1a8f3c; background: #e6f6ea; }
  .a.done small { color: #12692b; }
  .s { min-height: 110px; flex-direction: column; align-items: flex-start; justify-content: center; gap: 6px; }
  .s small { margin: 0; font-size: 20px; }
  .s img { width: 100%; max-height: 320px; object-fit: contain; border-radius: 10px; background: rgba(0,0,0,.06); }
  .s em { font-size: 18px; font-weight: 600; font-style: normal; color: #555; }
  #detail { display: none; }
  #back { display: block; width: calc(100% - 32px); margin: 8px 16px 32px; min-height: 64px; border: 3px solid #0b5cad; border-radius: 14px; background: #fff; color: #0b5cad; font: inherit; font-size: 24px; font-weight: 700; cursor: pointer; }
  #unfav { display: none; width: calc(100% - 32px); margin: 8px 16px; min-height: 56px; border: 2px solid #c3c9d2; border-radius: 14px; background: #fff; color: #555; font: inherit; font-size: 20px; font-weight: 600; cursor: pointer; }
  #ov { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; padding: 20px; }
  #ov.on { display: flex; }
  #box { background: #fff; border-radius: 20px; padding: 28px 22px; width: 100%; max-width: 420px; text-align: center; }
  #ico { font-size: 72px; line-height: 1; }
  #msg { font-size: 26px; font-weight: 700; margin: 16px 0 6px; }
  #sub { font-size: 21px; margin: 0 0 20px; }
  main { max-width: 1240px; margin: 0 auto; }
  #bar { height: 12px; margin-top: 10px; background: #e3e7ed; border-radius: 6px; overflow: hidden; }
  #bar i { display: block; height: 100%; width: 0; background: #1a8f3c; transition: width .3s; }
  .pc { display: none; }
  .a { transition: transform .1s, box-shadow .1s; }
  .a.drag { border-style: dashed; border-color: #0b5cad; background: #e8f1fb; }
  .a:focus-visible, #back:focus-visible, #unfav:focus-visible, #ok:focus-visible { outline: 4px solid #ffb300; outline-offset: 2px; }
  @media (hover: hover) {
    .a:hover { transform: translateY(-2px); box-shadow: 0 4px 14px rgba(0,0,0,.15); }
    #back:hover { background: #e8f1fb; }
    #unfav:hover { background: #f2f4f7; }
    #ok:hover { background: #094a8c; }
  }
  @media (min-width: 900px) {
    header { padding: 28px 16px; }
    header h1 { font-size: 34px; }
    header p { font-size: 22px; }
    main { padding: 12px 24px 0; }
    #sum, #name { margin: 14px 0 4px; padding: 20px; }
    #name { font-size: 34px; }
    #list { padding: 0 0 48px; gap: 16px; grid-template-columns: repeat(3, 1fr); }
    #slots { padding: 0 0 16px; gap: 20px; grid-template-columns: repeat(2, 1fr); }
    .s { min-height: 220px; align-items: center; text-align: center; font-size: 30px; gap: 14px; }
    .s small { font-size: 22px; }
    #back { width: 240px; margin: 12px auto 48px; }
    #unfav { width: 240px; margin: 12px auto 0; }
    .pc { display: inline; }
  }
  #ok { display: none; width: 100%; min-height: 64px; border: 0; border-radius: 14px; background: #0b5cad; color: #fff; font: inherit; font-size: 24px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>ส่งรูปภาพสนทนาธรรม 4 ฝ่าย</h1>
  <p id="mon">&nbsp;</p>
</header>

<main>
<div id="home">
  <div id="sum"><span id="sumt">กำลังโหลด…</span><div id="bar"><i></i></div></div>
  <div class="hint">กดที่ชื่อพื้นที่ของท่าน</div>
  <div id="list"></div>
</div>

<div id="detail">
  <div id="name"></div>
  <div class="hint">กดเลือกรูปที่จะส่ง<span class="pc"> หรือลากรูปมาวางในช่อง</span> (ส่งได้ 2 รูป)</div>
  <div id="slots"></div>
  <button id="unfav">☆ เอาดาวออก</button>
  <button id="back">← กลับ</button>
</div>
</main>

<input id="file" type="file" accept="image/*" hidden>
<div id="ov"><div id="box">
  <div id="ico"></div>
  <div id="msg"></div>
  <p id="sub"></p>
  <button id="ok">ตกลง</button>
</div></div>

<script>
const TH = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const SLOTS = ['ภาพบรรยากาศ', 'ภาพถ่ายหมู่'];
const MAX = 1920;
// Apps Script web app; used only when this page is hosted outside Apps Script (GitHub Pages)
const API = 'https://script.google.com/macros/s/AKfycbx0IgSpakNWcEQLuo8f2S9sA0xtOYNw6XgqxfkjVH-zs9fUzpccFgM3cHDGliiLYEOY/exec';
const $ = id => document.getElementById(id);
let S = null, area = null, slot = 0;

// areas this device has uploaded for, newest first; shown starred at the top
const KEY = 'fav';
function favs() {
  try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; }
}
function star(name, on = true) {
  const l = favs().filter(x => x != name);
  try { localStorage.setItem(KEY, JSON.stringify(on ? [name, ...l] : l)); } catch (e) {}
}

function btn(cls, title, note) {
  const b = document.createElement('button');
  b.className = cls;
  const n = document.createElement('span');
  n.textContent = title;
  const t = document.createElement('small');
  t.textContent = note;
  b.append(n, t);
  return b;
}

function render(s) {
  S = s;
  const [y, m] = s.month.split('-').map(Number);
  $('mon').textContent = 'เดือน ' + TH[m - 1] + ' ' + (y + 543);
  const full = s.areas.filter(a => a.sent.every(Boolean)).length;
  $('sumt').textContent = 'ส่งครบแล้ว ' + full + ' จาก ' + s.areas.length + ' พื้นที่';
  $('bar').firstChild.style.width = (100 * full / s.areas.length) + '%';
  const list = $('list');
  list.textContent = '';
  const fv = favs();
  const rank = a => (fv.indexOf(a.name) + 1) || Infinity;
  s.areas.slice().sort((a, b) => rank(a) - rank(b)).forEach(a => {
    const n = a.sent.filter(Boolean).length;
    const name = (fv.includes(a.name) ? '⭐ ' : '') + a.name;
    const b = n == a.sent.length
      ? btn('a done', name, '✅ ส่งครบแล้ว')
      : n ? btn('a part', name, 'ส่งแล้ว ' + n + ' จาก ' + a.sent.length + ' รูป')
      : btn('a', name, 'ยังไม่ส่ง');
    b.onclick = () => open(a.name);
    list.append(b);
  });
  if (area) detail();
}

// photo previews by Drive file id: data URL, or false if it can't be shown
const P = {}, Q = {};
function photo(name, n, id) {
  if (P[id]) {
    const im = document.createElement('img');
    im.src = P[id];
    im.alt = 'รูปที่ส่งแล้ว';
    return im;
  }
  const e = document.createElement('em');
  e.textContent = id in P ? 'แสดงรูปตัวอย่างไม่ได้' : 'กำลังโหลดรูป…';
  if (!(id in P) && !Q[id]) {
    Q[id] = 1;
    call('getPhoto', name, n)
      .then(r => { if (r) P[r.id] = r.url; else P[id] = false; })
      .catch(() => { e.textContent = 'โหลดรูปไม่สำเร็จ'; })
      .then(() => { delete Q[id]; if (id in P && area == name) detail(); });
  }
  return e;
}

function detail() {
  const a = S.areas.find(x => x.name == area);
  const fav = favs().includes(area);
  $('name').textContent = (fav ? '⭐ ' : '') + area;
  $('unfav').style.display = fav ? 'block' : 'none';
  const box = $('slots');
  box.textContent = '';
  SLOTS.forEach((t, i) => {
    const b = a.sent[i]
      ? btn('a s done', (i + 1) + '. ' + t, '✅ ส่งแล้ว (กดเพื่อเปลี่ยนรูป)')
      : btn('a s', (i + 1) + '. ' + t, '📷 ยังไม่ส่ง กดเพื่อเลือกรูป');
    if (a.ids[i]) b.insertBefore(photo(a.name, i + 1, a.ids[i]), b.lastChild);
    b.onclick = () => { slot = i + 1; $('file').value = ''; $('file').click(); };
    b.ondragover = e => { e.preventDefault(); b.classList.add('drag'); };
    b.ondragleave = () => b.classList.remove('drag');
    b.ondrop = e => {
      e.preventDefault();
      b.classList.remove('drag');
      slot = i + 1;
      send(e.dataTransfer.files[0]);
    };
    box.append(b);
  });
}

function open(name) {
  area = name;
  detail();
  $('home').style.display = 'none';
  $('detail').style.display = 'block';
  scrollTo(0, 0);
}

$('unfav').onclick = () => { star(area, false); render(S); };

$('back').onclick = () => {
  area = null;
  $('detail').style.display = 'none';
  $('home').style.display = 'block';
};

function show(ico, msg, sub, ok) {
  $('ico').textContent = ico;
  $('msg').textContent = msg;
  $('sub').textContent = sub;
  $('ok').style.display = ok ? 'block' : 'none';
  $('ov').classList.add('on');
}

async function api(fn, a) {
  const r = fn == 'upload'
    ? await fetch(API, { method: 'POST', body: JSON.stringify({ area: a[0], slot: a[1], b64: a[2], mime: a[3] }) })
    : await fetch(API + '?' + new URLSearchParams(fn == 'getPhoto' ? { api: 'photo', area: a[0], slot: a[1] } : { api: 'status' }));
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return fn == 'getPhoto' ? j.photo : j;
}

const GAS = typeof google != 'undefined' && google.script;
const call = (fn, ...args) => GAS
  ? new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args))
  : api(fn, args);

const read = f => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload = () => res(r.result);
  r.onerror = rej;
  r.readAsDataURL(f);
});

// shrink to MAX px JPEG; falls back to the original file if the browser can't decode it
async function encode(f) {
  try {
    const img = await new Promise((res, rej) => {
      const i = new Image();
      i.onload = () => res(i);
      i.onerror = rej;
      i.src = URL.createObjectURL(f);
    });
    const k = Math.min(1, MAX / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * k);
    c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(img.src);
    return { b64: c.toDataURL('image/jpeg', 0.85).split(',')[1], mime: 'image/jpeg' };
  } catch (e) {
    return { b64: (await read(f)).split(',')[1], mime: f.type };
  }
}

async function send(f) {
  if (!f) return;
  if (!f.type.startsWith('image/')) return show('❌', 'ไฟล์นี้ไม่ใช่รูปภาพ', 'กรุณาเลือกไฟล์รูปภาพ', true);
  const t = SLOTS[slot - 1];
  try {
    show('⏳', 'กำลังส่ง' + t, 'กรุณารอสักครู่ อย่าปิดหน้านี้', false);
    const d = await encode(f);
    const r = await call('upload', area, slot, d.b64, d.mime);
    star(area);
    // show the just-sent photo right away instead of downloading it back
    const id = r.areas.find(x => x.name == area).ids[slot - 1];
    if (id && d.mime == 'image/jpeg') P[id] = 'data:image/jpeg;base64,' + d.b64;
    render(r);
    show('✅', 'ส่งรูปสำเร็จ', area + ' — ' + t, true);
  } catch (err) {
    show('❌', 'ส่งรูปไม่สำเร็จ', 'กรุณาลองใหม่อีกครั้ง', true);
  }
}

$('file').onchange = e => send(e.target.files[0]);
// dropping outside a slot must not navigate away from the page
['dragover', 'drop'].forEach(t => addEventListener(t, e => e.preventDefault()));

$('ok').onclick = () => $('ov').classList.remove('on');

const load = () => call('getStatus').then(render).catch(() => { if (!S) $('sumt').textContent = 'โหลดข้อมูลไม่สำเร็จ กรุณาเปิดใหม่'; });
load();
setInterval(() => { if (!$('ov').classList.contains('on')) load(); }, 60000);
</script>
</body>
</html>
